<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - Escritório Contábil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-96 border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Portal do Cliente</h2>
            <p class="text-sm text-slate-500 mt-1">Acesse seus documentos e guias</p>
        </div>
        
        <form>
            <div class="mb-4">
                <label class="block text-slate-700 text-sm font-semibold mb-2" for="email">E-mail</label>
                <input class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-700 text-sm font-semibold mb-2" for="password">Senha</label>
                <input class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" type="password" id="password" placeholder="********" required>
            </div>
            
           <button type="button" onclick="window.location.href='dashboard.html'" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition duration-200 text-sm shadow-md">Entrar no Portal</button>
                Entrar no Portal
            </button>
        </form>
    </div>

</body>
</html>
